<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lion Forge Peptides — Cart</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --gold:#e8a820;--gold-bright:#ffd060;--gold-dim:#9a6e12;
  --navy:#080e20;--navy-mid:#0d1535;--navy-card:#101a38;
  --royal:#1e3d8f;--blue:#2547c0;
  --green:#22c55e;--red:#ef4444;--muted:#6a7a9e;
}
body{background:var(--navy);color:#dde4f5;font-family:'Inter',sans-serif;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse 55% 35% at 50% 0%,rgba(232,168,32,0.1) 0%,transparent 65%),
             radial-gradient(ellipse 40% 30% at 80% 15%,rgba(30,61,143,0.18) 0%,transparent 55%),
             linear-gradient(180deg,#0d1535 0%,#080e20 50%,#050b18 100%);
  pointer-events:none;z-index:0;}

nav{position:relative;z-index:100;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:16px 36px;border-bottom:1px solid rgba(232,168,32,0.15);
  background:rgba(6,10,24,0.92);backdrop-filter:blur(8px);}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.nav-logo img{width:36px;height:36px;border-radius:50%;object-fit:cover;}
.nav-logo span{font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--gold);letter-spacing:0.1em;}
.nav-links{display:flex;gap:28px;list-style:none;}
.nav-links a{font-size:13px;color:var(--muted);text-decoration:none;letter-spacing:0.05em;transition:color .2s;}
.nav-links a:hover{color:var(--gold-bright);}
.nav-links a.active{color:var(--gold);}.nav-right{display:flex;align-items:center;gap:14px;justify-content:flex-end;}
.nav-hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:6px;}
.nav-hamburger span{display:block;width:22px;height:2px;background:var(--gold);border-radius:2px;transition:transform .2s ease,opacity .2s ease;}
.nav-hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
.nav-hamburger.open span:nth-child(2){opacity:0;}
.nav-hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
.nav-drawer{position:fixed;top:0;right:0;bottom:0;width:min(260px,80vw);background:var(--navy-mid);border-left:1px solid rgba(232,168,32,0.2);z-index:999;display:flex;flex-direction:column;padding:80px 24px 24px;transform:translateX(100%);transition:transform .25s ease;box-shadow:-10px 0 40px rgba(0,0,0,0.4);}
.nav-drawer.open{transform:translateX(0);}
.nav-drawer a{display:block;padding:14px 0;color:var(--muted);text-decoration:none;font-size:15px;letter-spacing:0.05em;border-bottom:1px solid rgba(255,255,255,0.06);}
.nav-drawer a.active{color:var(--gold);}
.nav-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:998;}
.nav-overlay.open{display:block;}
@media(max-width:768px){
  .nav-links{display:none;}
  .nav-hamburger{display:flex;}
}

.page{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:50px 36px 80px;}

.page-label{font-family:'Inter',sans-serif;font-size:11px;font-weight:500;
  letter-spacing:0.35em;color:var(--muted);text-transform:uppercase;margin-bottom:10px;}
.page-title{font-family:'Inter',sans-serif;font-size:34px;font-weight:400;color:#edf1ff;margin-bottom:40px;}

/* CART TABLE */
.cart-table-wrap{background:rgba(16,26,56,0.6);border:1px solid rgba(232,168,32,0.15);
  border-radius:16px;overflow:hidden;margin-bottom:32px;}
.cart-table{width:100%;border-collapse:collapse;}
.cart-table thead tr{border-bottom:1px solid rgba(255,255,255,0.07);}
.cart-table thead th{padding:16px 24px;font-size:11px;font-weight:500;letter-spacing:0.2em;
  color:var(--muted);text-align:left;text-transform:uppercase;}
.cart-table thead th:last-child{text-align:right;}
.cart-table thead th.th-qty{text-align:center;}
.cart-table tbody tr{border-bottom:1px solid rgba(255,255,255,0.05);transition:background .15s;}
.cart-table tbody tr:hover{background:rgba(232,168,32,0.03);}
.cart-table tbody tr:last-child{border-bottom:none;}
.cart-table td{padding:20px 24px;vertical-align:middle;}
.td-product{font-size:15px;font-weight:600;color:#edf1ff;letter-spacing:0.04em;}
.td-variant{font-size:13px;color:var(--muted);}
.td-price{text-align:right;font-size:15px;font-weight:600;color:var(--gold);white-space:nowrap;}
.td-del{text-align:right;width:40px;}

/* QTY in table */
.tbl-qty{display:flex;align-items:center;justify-content:center;gap:0;
  border:1px solid rgba(232,168,32,0.2);border-radius:8px;overflow:hidden;width:fit-content;margin:0 auto;}
.tbl-qty-btn{background:rgba(255,255,255,0.04);border:none;color:#dde4f5;
  width:34px;height:36px;font-size:16px;cursor:pointer;transition:background .15s;}
.tbl-qty-btn:hover{background:rgba(232,168,32,0.15);}
.tbl-qty-num{width:40px;text-align:center;font-size:14px;font-weight:500;color:#dde4f5;
  background:rgba(255,255,255,0.03);border:none;
  border-left:1px solid rgba(232,168,32,0.15);border-right:1px solid rgba(232,168,32,0.15);
  height:36px;outline:none;}

/* SUBTOTAL ROW */
.subtotal-row td{padding:18px 24px;background:rgba(255,255,255,0.02);}
.subtotal-label{font-size:11px;letter-spacing:0.25em;color:var(--muted);text-transform:uppercase;}
.subtotal-amount{text-align:right;font-size:22px;font-weight:700;color:#edf1ff;}

/* DELETE BTN */
.del-btn{background:none;border:none;cursor:pointer;color:#2e3a52;transition:color .2s;
  display:flex;align-items:center;justify-content:center;padding:4px;}
.del-btn:hover{color:var(--red);}

/* EMPTY STATE */
.cart-empty{text-align:center;padding:80px 40px;}
.cart-empty-icon{font-size:48px;margin-bottom:16px;opacity:0.3;}
.cart-empty h3{font-size:20px;font-weight:400;color:#3a4a6a;margin-bottom:12px;}
.cart-empty a{color:var(--gold);text-decoration:none;font-size:14px;border-bottom:1px solid rgba(232,168,32,0.3);padding-bottom:2px;}

/* ACTIONS ROW */
.cart-actions{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;}
.continue-link{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;
  text-decoration:none;transition:color .2s;}
.continue-link:hover{color:var(--gold);}
.continue-link svg{transition:transform .2s;}
.continue-link:hover svg{transform:translateX(-3px);}
.checkout-btn{display:inline-flex;align-items:center;gap:10px;
  background:var(--royal);border:1px solid rgba(232,168,32,0.35);border-radius:10px;
  color:var(--gold-bright);font-family:'Share Tech Mono',monospace;font-size:13px;
  letter-spacing:0.2em;padding:16px 40px;cursor:pointer;transition:background .2s,transform .15s;
  box-shadow:0 4px 30px rgba(30,61,143,0.4);}
.checkout-btn:hover{background:var(--blue);transform:translateY(-1px);}

/* ORDER SUMMARY SIDEBAR */
.cart-layout{display:grid;grid-template-columns:1fr 320px;gap:28px;align-items:start;}
.summary-card{background:rgba(16,26,56,0.6);border:1px solid rgba(232,168,32,0.15);
  border-radius:16px;padding:24px;position:sticky;top:24px;}
.summary-title{font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:0.25em;
  color:var(--gold);margin-bottom:20px;}
.summary-line{display:flex;justify-content:space-between;margin-bottom:12px;font-size:13px;}
.summary-line span:first-child{color:var(--muted);}
.summary-line span:last-child{color:#dde4f5;}
.summary-divider{height:1px;background:rgba(232,168,32,0.1);margin:16px 0;}
.summary-total{display:flex;justify-content:space-between;}
.summary-total span:first-child{font-size:13px;color:var(--muted);}
.summary-total span:last-child{font-size:20px;font-weight:700;color:var(--gold);}
.summary-note{font-size:11px;color:#2e3a52;margin-top:16px;line-height:1.6;text-align:center;}

@media(max-width:768px){
  .cart-layout{grid-template-columns:1fr;}
  .cart-table thead th:nth-child(2){display:none;}
  .cart-table td:nth-child(2){display:none;}
}

/* ── COMING SOON SPLASH ──────────────────────────────────────── */
#coming-soon-splash{
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  background:rgba(5,11,24,0.92);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  animation:splashFadeIn .4s ease;
}
@keyframes splashFadeIn{from{opacity:0}to{opacity:1}}

.splash-box{
  position:relative;
  background:linear-gradient(145deg,rgba(16,26,56,0.95) 0%,rgba(8,14,32,0.98) 100%);
  border:1px solid rgba(232,168,32,0.25);
  border-radius:20px;
  padding:56px 52px 48px;
  max-width:460px;
  width:90%;
  text-align:center;
  box-shadow:0 0 80px rgba(232,168,32,0.08),0 30px 80px rgba(0,0,0,0.6);
  animation:splashSlideUp .45s cubic-bezier(.22,.68,0,1.2);
}
@keyframes splashSlideUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}

.splash-icon{
  width:64px;height:64px;margin:0 auto 24px;
  background:radial-gradient(circle,rgba(232,168,32,0.18) 0%,transparent 70%);
  border:1px solid rgba(232,168,32,0.3);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.splash-icon svg{opacity:0.9;}

.splash-eyebrow{
  font-family:'Share Tech Mono',monospace;
  font-size:10px;letter-spacing:0.4em;
  color:var(--gold);text-transform:uppercase;
  margin-bottom:14px;
}
.splash-heading{
  font-family:'Inter',sans-serif;
  font-size:28px;font-weight:300;
  color:#edf1ff;letter-spacing:0.03em;
  line-height:1.2;margin-bottom:16px;
}
.splash-heading strong{font-weight:600;color:var(--gold-bright);}

.splash-body{
  font-size:14px;color:#6a7a9e;line-height:1.7;
  margin-bottom:36px;
}

.splash-divider{
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(232,168,32,0.2),transparent);
  margin-bottom:28px;
}

.splash-cta{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--royal);
  border:1px solid rgba(232,168,32,0.35);
  border-radius:10px;
  color:var(--gold-bright);
  font-family:'Share Tech Mono',monospace;
  font-size:12px;letter-spacing:0.2em;
  padding:14px 36px;cursor:pointer;
  transition:background .2s,transform .15s,box-shadow .2s;
  box-shadow:0 4px 30px rgba(30,61,143,0.4);
  text-decoration:none;
}
.splash-cta:hover{
  background:var(--blue);transform:translateY(-1px);
  box-shadow:0 8px 40px rgba(30,61,143,0.55);
}

.splash-dismiss{
  display:block;margin-top:18px;
  font-size:12px;color:#2e3a52;
  background:none;border:none;cursor:pointer;
  letter-spacing:0.05em;transition:color .2s;
}
.splash-dismiss:hover{color:var(--muted);}

/* glow ring animation */
.splash-ring{
  position:absolute;inset:-1px;border-radius:21px;
  background:transparent;
  border:1px solid transparent;
  background-clip:padding-box;
  animation:ringPulse 3s ease-in-out infinite;
  pointer-events:none;
}
@keyframes ringPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(232,168,32,0.0);}
  50%{box-shadow:0 0 0 8px rgba(232,168,32,0.06);}
}
</style>
</head>

  <a href="index.html" class="nav-logo">

  <ul class="nav-links">

<script>
function toggleNavMenu() {
  document.getElementById('navHamburger').classList.toggle('open');
  document.getElementById('navDrawer').classList.toggle('open');
  document.getElementById('navOverlay').classList.toggle('open');
}

<script>fetch('/api/auth/me',{credentials:'include',cache:'no-store'}).then(r=>r.ok?r.json():null).then(u=>{try{if(!u){const c=sessionStorage.getItem('lfp_user');if(c)u=JSON.parse(c);}else{sessionStorage.setItem('lfp_user',JSON.stringify(u));}}catch(e){}if(u){var b=document.getElementById('lfp-signout');if(b)b.style.display='inline-block';}}).catch(()=>{});</script>

<div class="page">
  <div class="page-label">Active Selection</div>
  <div class="page-title">Cart</div>

  <div id="cart-content"></div>
</div>

<script>
// ── LOAD CART ────────────────────────────────────────────────────
function loadCartData() {
  try {
    if (window.location.hash.length > 1) {
      const s = window.location.hash.slice(1);
      const d = JSON.parse(decodeURIComponent(escape(atob(s))));
      if (Array.isArray(d) && d.length > 0) return d;
    }
  } catch(e) {}
  try {
    const r = localStorage.getItem('lfp_cart');
    if (r) { const d = JSON.parse(r); if (Array.isArray(d) && d.length > 0) return d; }
  } catch(e) {}
  return [];
}

let cart = [];

function saveAndRender() {
  try { localStorage.setItem('lfp_cart', JSON.stringify(cart)); } catch(e) {}
  render();
}

function changeQty(key, delta) {
  const item = cart.find(c => c.key === key);
  if (!item) return;
  item.qty = Math.max(1, item.qty + delta);
  saveAndRender();
}

function removeItem(key) {
  cart = cart.filter(c => c.key !== key);
  saveAndRender();
}

function getSubtotal() {
  return cart.reduce((s, c) => s + c.price * c.qty, 0);
}

function goToCheckout() {
  if (cart.length === 0) { alert('Your cart is empty'); return; }
  try { localStorage.setItem('lfp_cart', JSON.stringify(cart)); } catch(e) {}
  const hash = btoa(unescape(encodeURIComponent(JSON.stringify(cart))));
  window.location.href = 'lion-forge-checkout.html#' + hash;
}

function render() {
  const el = document.getElementById('cart-content');
  if (!el) return;

  if (cart.length === 0) {
    el.innerHTML = `<div class="cart-empty">
      <div class="cart-empty-icon">&#128722;</div>
      <h3>Your cart is empty</h3>
      <a href="lion-forge-shop.html">&#8592; Continue shopping</a>
    </div>`;
    return;
  }

  const subtotal  = getSubtotal();
  const itemCount = cart.reduce((s, c) => s + c.qty, 0);

  const rows = cart.map(c => `
    <tr>
      <td class="td-product">${c.name}</td>
      <td class="td-variant">${c.variant}</td>
      <td>
        <div class="tbl-qty">
          <button class="tbl-qty-btn" onclick="changeQty('${c.key}',-1)">&#8722;</button>
          <input class="tbl-qty-num" type="number" value="${c.qty}" min="1"
            onchange="const it=cart.find(x=>x.key==='${c.key}');if(it){it.qty=Math.max(1,parseInt(this.value)||1);saveAndRender();}">
          <button class="tbl-qty-btn" onclick="changeQty('${c.key}',1)">+</button>
        </div>
      </td>
      <td class="td-price">$${(c.price * c.qty).toFixed(2)}</td>
      <td class="td-del">
        <button class="del-btn" onclick="removeItem('${c.key}')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
          </svg>
        </button>
      </td>
    </tr>`).join('');

  el.innerHTML = `
    <div class="cart-layout">
      <div>
        <div class="cart-table-wrap">
          <table class="cart-table">
            <thead>
              <tr>
                <th>Product</th><th>Variant</th>
                <th class="th-qty">QTY</th>
                <th style="text-align:right;">Price</th><th></th>
              </tr>
            </thead>
            <tbody>
              ${rows}
              <tr class="subtotal-row">
                <td colspan="3" class="subtotal-label">Subtotal</td>
                <td class="subtotal-amount">$${subtotal.toFixed(2)}</td>
                <td></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="cart-actions">
          <a href="lion-forge-shop.html" class="continue-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
            </svg>
            Continue Shopping
          </a>
        </div>
      </div>
      <div class="summary-card">
        <div class="summary-title">ORDER SUMMARY</div>
        <div class="summary-line"><span>Items (${itemCount})</span><span>$${subtotal.toFixed(2)}</span></div>
        <div class="summary-line"><span>Shipping</span><span style="color:var(--green);">Calculated at checkout</span></div>
        <div class="summary-divider"></div>
        <div class="summary-total"><span>Total</span><span>$${subtotal.toFixed(2)}</span></div>
        <div style="margin-top:20px;">
          <button class="checkout-btn" style="width:100%;justify-content:center;" onclick="goToCheckout()">
            PROCEED TO CHECKOUT &nbsp;&#x2192;
          </button>
        </div>
        <div class="summary-note">
          All orders processed within 24–48 hours.<br>
          Orders paid by 4pm CST ship same day Mon–Fri.
        </div>
      </div>
    </div>`;
}

// ── COMING SOON SPLASH ───────────────────────────────────────
function dismissSplash() {
  const splash = document.getElementById('coming-soon-splash');
  if (!splash) return;
  splash.style.transition = 'opacity .35s ease';
  splash.style.opacity = '0';
  setTimeout(() => splash.remove(), 360);
}

// ── INIT ─────────────────────────────────────────────────────────
window.addEventListener('load', function() {
  cart = loadCartData();
  render();
});
</script>
