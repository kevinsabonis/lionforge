<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lion Forge Peptides — Account</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --gold:#e8a820;--gold-bright:#ffd060;--gold-dim:#9a6e12;
  --navy:#080e20;--navy-mid:#0d1535;--navy-card:#101a38;
  --royal:#1e3d8f;--blue:#2547c0;
  --green:#22c55e;--red:#ef4444;--orange:#f97316;--muted:#6a7a9e;
}
body{background:var(--navy);color:#dde4f5;font-family:'Inter',sans-serif;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse 55% 35% at 50% 0%,rgba(232,168,32,0.1) 0%,transparent 65%),
             radial-gradient(ellipse 40% 30% at 80% 15%,rgba(30,61,143,0.18) 0%,transparent 55%),
             linear-gradient(180deg,#0d1535 0%,#080e20 50%,#050b18 100%);
  pointer-events:none;z-index:0;}

nav{position:relative;z-index:100;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:16px 36px;border-bottom:1px solid rgba(232,168,32,0.15);
  background:rgba(6,10,24,0.92);backdrop-filter:blur(8px);}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.nav-logo img{width:36px;height:36px;border-radius:50%;object-fit:cover;}
.nav-logo span{font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--gold);letter-spacing:0.1em;}
.nav-links{display:flex;gap:28px;list-style:none;}
.nav-links a{font-size:13px;color:var(--muted);text-decoration:none;letter-spacing:0.05em;transition:color .2s;}
.nav-links a:hover{color:var(--gold-bright);}
.nav-links a.active{color:var(--gold);}.nav-right{display:flex;align-items:center;gap:14px;justify-content:flex-end;}
.nav-hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:6px;}
.nav-hamburger span{display:block;width:22px;height:2px;background:var(--gold);border-radius:2px;transition:transform .2s ease,opacity .2s ease;}
.nav-hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
.nav-hamburger.open span:nth-child(2){opacity:0;}
.nav-hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
.nav-drawer{position:fixed;top:0;right:0;bottom:0;width:min(260px,80vw);background:var(--navy-mid);border-left:1px solid rgba(232,168,32,0.2);z-index:999;display:flex;flex-direction:column;padding:80px 24px 24px;transform:translateX(100%);transition:transform .25s ease;box-shadow:-10px 0 40px rgba(0,0,0,0.4);}
.nav-drawer.open{transform:translateX(0);}
.nav-drawer a{display:block;padding:14px 0;color:var(--muted);text-decoration:none;font-size:15px;letter-spacing:0.05em;border-bottom:1px solid rgba(255,255,255,0.06);}
.nav-drawer a.active{color:var(--gold);}
.nav-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:998;}
.nav-overlay.open{display:block;}
@media(max-width:768px){
  .nav-links{display:none;}
  .nav-hamburger{display:flex;}
}

.page{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:48px 24px 80px;}

/* PROFILE HEADER */
.profile-header{margin-bottom:32px;}
.profile-label{font-size:11px;letter-spacing:0.35em;color:var(--muted);text-transform:uppercase;margin-bottom:10px;}
.profile-name{font-size:34px;font-weight:400;color:#edf1ff;margin-bottom:6px;}
.profile-email{font-size:14px;color:var(--muted);font-family:'Share Tech Mono',monospace;letter-spacing:0.06em;}

/* SECTION CARD */
.section-card{background:rgba(16,26,56,0.65);border:1px solid rgba(232,168,32,0.15);
  border-radius:16px;overflow:hidden;margin-bottom:20px;}
.section-head{padding:14px 22px;border-bottom:1px solid rgba(255,255,255,0.06);}
.section-head h3{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:0.28em;
  color:var(--gold);text-transform:uppercase;}
.section-body{padding:24px 22px;}

/* FORMS */
.form-full{margin-bottom:14px;}
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:18px;}
.form-group label{display:block;font-size:12px;font-weight:500;color:#dde4f5;margin-bottom:7px;}
.form-input{width:100%;padding:12px 14px;background:rgba(255,255,255,0.05);
  border:1px solid rgba(232,168,32,0.15);border-radius:10px;color:#dde4f5;
  font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s;}
.form-input:focus{border-color:rgba(232,168,32,0.45);}
.form-input::placeholder{color:#2e3a52;}

.save-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 24px;
  background:var(--royal);border:1px solid rgba(232,168,32,0.35);border-radius:10px;
  color:var(--gold-bright);font-family:'Share Tech Mono',monospace;font-size:12px;
  letter-spacing:0.15em;cursor:pointer;transition:background .2s;}
.save-btn:hover{background:var(--blue);}
.save-confirm{font-size:11px;color:var(--green);margin-left:12px;opacity:0;transition:opacity .3s;}

/* ORDER HISTORY */
.order-card{background:rgba(255,255,255,0.02);border:1px solid rgba(232,168,32,0.1);
  border-radius:12px;padding:18px 20px;margin-bottom:12px;transition:border-color .2s;cursor:pointer;}
.order-card:hover{border-color:rgba(232,168,32,0.25);}
.order-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.order-card-left{display:flex;align-items:center;gap:10px;}
.order-icon{color:var(--muted);}
.order-num{font-family:'Share Tech Mono',monospace;font-size:15px;font-weight:600;color:#edf1ff;}
.order-total{font-size:15px;font-weight:600;color:#edf1ff;}
.status-badge{display:inline-block;font-size:10px;font-weight:600;letter-spacing:0.12em;
  padding:3px 10px;border-radius:6px;text-transform:uppercase;margin-bottom:8px;}
.status-pending{color:var(--orange);}
.status-processing{color:var(--gold);}
.status-shipped{color:#60a5fa;}
.status-delivered{color:var(--green);}
.status-cancelled{color:var(--red);}
.order-items{font-size:12px;color:var(--muted);line-height:1.8;}

/* EXPANDED ORDER */
.order-detail{display:none;margin-top:14px;border-top:1px solid rgba(255,255,255,0.06);padding-top:14px;}
.order-detail.open{display:block;}
.detail-row{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;
  border-bottom:1px solid rgba(255,255,255,0.04);}
.detail-row:last-child{border-bottom:none;}
.detail-label{color:var(--muted);}
.detail-val{color:#dde4f5;text-align:right;}
.detail-total-row{display:flex;justify-content:space-between;font-size:13px;
  font-weight:600;padding-top:10px;margin-top:6px;border-top:1px solid rgba(232,168,32,0.15);}
.detail-total-row .detail-label{color:var(--muted);}
.detail-total-row .detail-val{color:var(--gold);}

/* EMPTY ORDERS */
.empty-orders{text-align:center;padding:40px 20px;}
.empty-orders p{color:var(--muted);font-size:14px;margin-bottom:16px;}
.shop-link{display:inline-block;padding:11px 28px;background:var(--royal);
  border:1px solid rgba(232,168,32,0.3);border-radius:10px;color:var(--gold-bright);
  font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:0.12em;
  text-decoration:none;}

/* LOGOUT */
.logout-btn{background:none;border:none;color:#3a4a6a;font-size:13px;cursor:pointer;
  transition:color .2s;margin-top:8px;padding:0;}
.logout-btn:hover{color:var(--red);}

/* TOAST */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  background:#1e3d8f;border:1px solid rgba(232,168,32,0.3);border-radius:10px;
  padding:12px 24px;color:var(--gold-bright);font-size:13px;
  font-family:'Share Tech Mono',monospace;letter-spacing:0.1em;
  opacity:0;transition:opacity .3s;z-index:9999;pointer-events:none;}
.toast.show{opacity:1;}

@media(max-width:600px){
  .form-grid-2,.form-grid-3{grid-template-columns:1fr;}
}
</style>

<div class="page">

  <!-- PROFILE HEADER -->
  <div class="profile-header">

      <button onclick="editName()" id="edit-name-btn" style="background:none;border:1px solid rgba(232,168,32,0.3);border-radius:6px;color:#6a7a9e;font-size:11px;padding:4px 10px;cursor:pointer;letter-spacing:0.08em;">EDIT</button>

    <div id="name-edit-form" style="display:none;margin:6px 0 4px;display:none;">

      <button onclick="saveName()" style="padding:8px 16px;background:#1e3d8f;border:1px solid rgba(232,168,32,0.3);border-radius:8px;color:#ffd060;font-size:12px;cursor:pointer;">SAVE</button>

<script>
document.addEventListener('DOMContentLoaded', () => {
  (async function() {
      let user;
      try {
        try { const cached = sessionStorage.getItem('lfp_user'); if (cached) user = JSON.parse(cached); } catch(e) {}
        let cookieOk = false;
        for (let attempt = 0; attempt < 4; attempt++) {
          if (attempt > 0) await new Promise(res => setTimeout(res, attempt * 500));
          try {
            const r = await apiFetch('/api/auth/me', { cache: 'no-store' });
            if (r.ok) { user = await r.json(); try { sessionStorage.setItem('lfp_user', JSON.stringify(user)); } catch(e) {} cookieOk = true; break; }
          } catch(e) {}
        }
        if (!user) { sessionStorage.removeItem('lfp_user'); window.location.href = 'index.html?dest=account'; return; }
        window._lfCurrentUser = user;
      } catch(e) { window.location.href = 'index.html?dest=account'; return; }

      // Populate profile
      document.getElementById('profile-name').textContent  = user.displayName || 'Customer';
      document.getElementById('profile-email').textContent = user.email;
      // Pre-fill saved address
      if (user.address) {
        const parts = user.address.split('|');
        if (parts[0]) document.getElementById('addr-street').value = parts[0];
        if (parts[1]) document.getElementById('addr-city').value   = parts[1];
        if (parts[2]) document.getElementById('addr-state').value  = parts[2];
        if (parts[3]) document.getElementById('addr-zip').value    = parts[3];
      }

      // Load orders
      try {
        const r = await apiFetch('/api/orders');
        const orders = await r.json();
        renderOrders(orders);
      } catch(e) {
        document.getElementById('order-history-body').innerHTML =
          '<div style="padding:20px;color:var(--red);font-size:13px;">Error loading orders. Please try again.</div>';
      }
    })();
});

const STATUS_COLORS = {
  pending:'status-pending', processing:'status-processing',
  shipped:'status-shipped', delivered:'status-delivered', cancelled:'status-cancelled'
};

function renderOrders(orders) {
  const el = document.getElementById('order-history-body');
  if (!orders || orders.length === 0) {
    el.innerHTML = `<div class="empty-orders">
      <p>No orders yet.</p>
      <a href="lion-forge-shop.html" class="shop-link">BROWSE SHOP</a>
    </div>`;
    return;
  }
  el.innerHTML = orders.map((o, i) => {
    const sc = STATUS_COLORS[o.status] || 'status-pending';
    const itemsShort = (o.items || []).slice(0,2).map(it =>
      `${it.name} (${it.variant}) x${it.qty}`).join('<br>');
    const more = (o.items||[]).length > 2
      ? `<br><span style="color:#3a4a6a;">+${o.items.length-2} more</span>` : '';
    const allItems = (o.items||[]).map(it =>
      `<div class="detail-row">
        <span class="detail-label">${it.name} (${it.variant}) x${it.qty}</span>
        <span class="detail-val">$${(it.price*it.qty).toFixed(2)}</span>
      </div>`).join('');
    const dateStr = o.date ? new Date(o.date).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}) : '—';
    return `<div class="order-card" onclick="toggleOrder(${i})">
      <div class="order-card-top">
        <div class="order-card-left">
          <div class="order-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
              <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
            </svg>
          </div>
          <span class="order-num">#${o.order_num}</span>
        </div>
        <span class="order-total">$${(o.total||0).toFixed(2)}</span>
      </div>
      <div class="${sc} status-badge">${(o.status||'pending').toUpperCase()}</div>
      <div class="order-items">${itemsShort}${more}</div>
      <div class="order-detail" id="detail-${i}">
        ${allItems}
        <div class="detail-row">
          <span class="detail-label">Shipping (${o.shipping_method||'Ground'})</span>
          <span class="detail-val">$${(o.shipping||10).toFixed(2)}</span>
        </div>
        <div class="detail-total-row">
          <span class="detail-label">Order Total</span>
          <span class="detail-val">$${(o.total||0).toFixed(2)}</span>
        </div>
        <div class="detail-row" style="margin-top:10px;">
          <span class="detail-label">Payment</span>
          <span class="detail-val">${o.payment_method||'—'}</span>
        </div>
        ${o.tracking_number ? `<div class="detail-row" style="border-left:2px solid #22c55e;padding-left:10px;margin:6px 0;"><span class="detail-label">${o.carrier||'Carrier'} Tracking</span><span class="detail-val" style="color:#22c55e;font-family:'Share Tech Mono',monospace;">${o.tracking_number}</span></div>` : ''}
        <div class="detail-row">
          <span class="detail-label">Ship to</span>
          <span class="detail-val">${o.address||'—'}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Order Date</span>
          <span class="detail-val">${dateStr}</span>
        </div>
        <div style="text-align:center;margin-top:14px;padding-top:12px;border-top:1px solid rgba(232,168,32,0.1);">
          <a href="mailto:support@lionforgepeptides.com?subject=Order%20%23${o.order_num}" style="display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:rgba(232,168,32,0.06);border:1px solid rgba(232,168,32,0.25);border-radius:20px;color:#ffd060;font-family:'Share Tech Mono',monospace;font-size:10.5px;letter-spacing:0.08em;text-decoration:none;transition:background .2s ease,border-color .2s ease;" onmouseover="this.style.background='rgba(232,168,32,0.14)';this.style.borderColor='rgba(232,168,32,0.5)';" onmouseout="this.style.background='rgba(232,168,32,0.06)';this.style.borderColor='rgba(232,168,32,0.25)';">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M4 4h16v16H4z"/><path d="m4 6 8 7 8-7"/></svg>
            Questions about this order?
          </a>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleOrder(i) {
  const el = document.getElementById('detail-' + i);
  if (el) el.classList.toggle('open');
}

async function saveAddress() {
  const street = document.getElementById('addr-street').value.trim();
  const city   = document.getElementById('addr-city').value.trim();
  const state  = document.getElementById('addr-state').value.trim();
  const zip    = document.getElementById('addr-zip').value.trim();
  const address = [street, city, state, zip].join('|');
  try {
    await fetch('/api/users/me', { method:'PUT', credentials:'include', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ address }) });
    const conf = document.getElementById('save-confirm');
    conf.style.opacity = '1';
    setTimeout(() => { conf.style.opacity = '0'; }, 2000);
  } catch(e) { showToast('Could not save address'); }
}

function editName() {
  const form = document.getElementById('name-edit-form');
  const btn  = document.getElementById('edit-name-btn');
  const showing = form.style.display !== 'none';
  form.style.display = showing ? 'none' : 'block';
  btn.textContent = showing ? 'EDIT' : 'CANCEL';
  if (!showing) {
    const inp = document.getElementById('inp-display-name');
    inp.value = document.getElementById('profile-name').textContent;
    inp.focus(); inp.select();
  }
}
async function saveName() {
  const name = document.getElementById('inp-display-name').value.trim();
  if (!name) return;
  try {
    await fetch('/api/users/me', { method:'PUT', credentials:'include', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ displayName: name }) });
    document.getElementById('profile-name').textContent = name;
    document.getElementById('name-edit-form').style.display = 'none';
    document.getElementById('edit-name-btn').textContent = 'EDIT';
    showToast('Name updated');
  } catch(e) { showToast('Could not update name'); }
}
function logout() {
  fetch('/api/auth/logout', { method: 'POST', credentials: 'include' })
    .finally(() => { window.location.href = 'index.html?dest=account'; });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
