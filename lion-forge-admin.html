<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lion Forge — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--gold:#e8a820;--gold-bright:#ffd060;--gold-dim:#9a6e12;--navy:#080e20;
  --navy-card:#101a38;--royal:#1e3d8f;--blue:#2547c0;--green:#22c55e;
  --red:#ef4444;--orange:#f97316;--muted:#6a7a9e;}
body{background:var(--navy);color:#dde4f5;font-family:'Inter',sans-serif;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse 55% 35% at 50% 0%,rgba(232,168,32,0.1) 0%,transparent 65%),
  linear-gradient(180deg,#0d1535 0%,#080e20 50%,#050b18 100%);
  pointer-events:none;z-index:0;}

/* NAV */
nav{position:relative;z-index:100;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:14px 32px;border-bottom:1px solid rgba(232,168,32,0.15);background:rgba(6,10,24,0.95);backdrop-filter:blur(8px);}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.nav-logo img{width:34px;height:34px;border-radius:50%;object-fit:cover;}
.nav-logo span{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--gold);letter-spacing:0.1em;}
.nav-right{display:flex;align-items:center;gap:16px;}
.nav-link{font-size:13px;color:var(--muted);text-decoration:none;transition:color .2s;background:none;border:none;cursor:pointer;font-family:'Inter',sans-serif;}
.nav-link:hover{color:var(--gold);}
.signout-btn{color:#3a4a6a;font-size:13px;background:none;border:none;cursor:pointer;transition:color .2s;}
.signout-btn:hover{color:var(--red);}

/* AUTH GATE */
.auth-gate{position:relative;z-index:1;max-width:380px;margin:80px auto;padding:40px;
  background:rgba(16,26,56,0.7);border:1px solid rgba(232,168,32,0.2);border-radius:16px;text-align:center;}
.auth-gate h2{font-family:'Share Tech Mono',monospace;color:var(--gold);font-size:13px;letter-spacing:0.3em;margin-bottom:24px;}
.auth-input{width:100%;padding:12px 14px;background:rgba(255,255,255,0.05);
  border:1px solid rgba(232,168,32,0.2);border-radius:10px;color:#dde4f5;font-size:14px;
  font-family:'Inter',sans-serif;outline:none;margin-bottom:12px;}
.auth-input:focus{border-color:rgba(232,168,32,0.5);}
.auth-btn{width:100%;padding:13px;background:var(--royal);border:1px solid rgba(232,168,32,0.35);
  border-radius:10px;color:var(--gold-bright);font-family:'Share Tech Mono',monospace;font-size:12px;
  letter-spacing:0.15em;cursor:pointer;transition:background .2s;}
.auth-btn:hover{background:var(--blue);}

/* TABS */
.tab-bar{position:relative;z-index:1;display:flex;gap:4px;padding:20px 32px 0;border-bottom:1px solid rgba(232,168,32,0.1);}
.tab{padding:10px 24px;font-size:13px;font-weight:500;cursor:pointer;background:none;border:none;
  color:var(--muted);font-family:'Inter',sans-serif;border-bottom:2px solid transparent;
  transition:all .2s;letter-spacing:0.04em;}
.tab:hover{color:#dde4f5;}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}

/* PAGE */
.tab-content{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:28px 32px 80px;display:none;}
.tab-content.active{display:block;}

/* STATS */
.stats-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:24px;}
.stat{background:rgba(16,26,56,0.6);border:1px solid rgba(232,168,32,0.15);border-radius:10px;
  padding:14px 20px;text-align:center;min-width:100px;flex:1;}
.stat-num{font-size:24px;font-weight:700;color:#edf1ff;}
.stat-label{font-size:10px;letter-spacing:0.15em;color:var(--muted);text-transform:uppercase;margin-top:3px;}

/* FILTERS */
.filter-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
.search-box{flex:1;min-width:220px;padding:10px 14px;background:rgba(255,255,255,0.04);
  border:1px solid rgba(232,168,32,0.2);border-radius:8px;color:#dde4f5;font-size:13px;
  font-family:'Share Tech Mono',monospace;outline:none;}
.search-box::placeholder{color:#3a4a6a;}
.filter-btn{padding:9px 18px;border-radius:8px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;
  border:1px solid rgba(232,168,32,0.2);background:rgba(255,255,255,0.04);color:var(--muted);transition:all .2s;}
.filter-btn.active,.filter-btn:hover{background:rgba(232,168,32,0.12);color:var(--gold);border-color:rgba(232,168,32,0.4);}

/* ORDER CARDS */
.order-list{display:flex;flex-direction:column;gap:10px;}
.order-card{background:rgba(16,26,56,0.65);border:1px solid rgba(232,168,32,0.1);border-radius:12px;overflow:hidden;transition:border-color .2s;}
.order-card:hover{border-color:rgba(232,168,32,0.25);}
.order-card.pending{border-left:3px solid var(--orange);}
.order-card.shipped{border-left:3px solid var(--green);}
.order-card.delivered{border-left:3px solid #60a5fa;}
.order-card.cancelled{border-left:3px solid var(--red);}
.cancel-order-btn{padding:9px 16px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.3);
  border-radius:8px;color:#fca5a5;font-family:'Share Tech Mono',monospace;font-size:11px;
  letter-spacing:0.1em;cursor:pointer;white-space:nowrap;transition:all .2s;}
.cancel-order-btn:hover{background:rgba(239,68,68,0.2);border-color:rgba(239,68,68,0.55);}
.cancelled-panel{background:rgba(16,26,56,0.5);border:1px solid rgba(239,68,68,0.18);border-radius:12px;margin-top:28px;overflow:hidden;}
.cancelled-panel-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;
  border-bottom:1px solid rgba(239,68,68,0.1);cursor:pointer;user-select:none;}
.cancelled-panel-hdr h3{font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:0.2em;color:var(--red);}
.cancelled-panel-body{padding:12px 0 8px;}
.order-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;gap:12px;flex-wrap:wrap;}
.order-head-left{display:flex;align-items:center;gap:14px;}
.order-num{font-family:'Share Tech Mono',monospace;font-size:15px;font-weight:700;color:#edf1ff;min-width:60px;}
.cust-name{font-size:13px;font-weight:500;color:#edf1ff;}
.cust-email{font-size:11px;color:var(--muted);margin-top:1px;}
.order-head-right{display:flex;align-items:center;gap:10px;}
.order-amt{font-size:14px;font-weight:600;color:var(--gold);}
.status-pill{font-size:10px;font-weight:700;letter-spacing:0.12em;padding:4px 10px;border-radius:20px;text-transform:uppercase;}
.pill-pending{color:var(--orange);background:rgba(249,115,22,0.12);}
.pill-shipped{color:var(--green);background:rgba(34,197,94,0.12);}
.pill-delivered{color:#60a5fa;background:rgba(96,165,250,0.12);}
.pill-cancelled{color:var(--red);background:rgba(239,68,68,0.12);}
.pill-picked_up{color:#a78bfa;background:rgba(167,139,250,0.12);}
.chevron{color:var(--muted);transition:transform .25s;font-size:11px;}
.chevron.open{transform:rotate(180deg);}

.order-detail{display:none;border-top:1px solid rgba(255,255,255,0.05);padding:16px 18px 18px;}
.order-detail.open{display:block;}
.detail-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:16px;}
.detail-col h4{font-size:10px;letter-spacing:0.2em;color:var(--muted);text-transform:uppercase;margin-bottom:8px;}
.detail-row{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.04);}
.detail-row:last-child{border:none;}
.detail-row span:last-child{color:var(--gold-bright);font-weight:500;text-align:right;max-width:60%;}
.items-block{font-size:12px;color:#dde4f5;line-height:1.9;}

/* TRACKING PANEL */
.track-panel{background:rgba(255,255,255,0.03);border:1px solid rgba(232,168,32,0.15);border-radius:10px;padding:14px 16px;}
.track-panel h4{font-size:10px;letter-spacing:0.2em;color:var(--gold);text-transform:uppercase;margin-bottom:12px;}
.track-fields{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.tf{display:flex;flex-direction:column;gap:4px;flex:1;min-width:130px;}
.tf label{font-size:11px;color:var(--muted);}
.tf select,.tf input{padding:9px 11px;background:rgba(255,255,255,0.05);border:1px solid rgba(232,168,32,0.2);
  border-radius:8px;color:#dde4f5;font-size:13px;font-family:'Inter',sans-serif;outline:none;}
.tf select{background:rgba(16,26,56,0.8);cursor:pointer;}
.ship-btn{padding:10px 20px;background:var(--green);border:none;border-radius:8px;
  color:#fff;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:0.12em;
  cursor:pointer;white-space:nowrap;transition:opacity .2s;}
.ship-btn:hover{opacity:0.85;}
.ship-btn:disabled{background:#2e3a52;color:#4a5a7a;cursor:not-allowed;}
.shipped-info{font-size:13px;color:var(--green);display:flex;align-items:center;gap:8px;}

/* ── PRODUCTS TAB ── */
.prod-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
.prod-toolbar h2{font-family:'Share Tech Mono',monospace;font-size:15px;letter-spacing:0.2em;color:var(--gold);}
.add-prod-btn{padding:10px 20px;background:rgba(232,168,32,0.1);border:1px dashed rgba(232,168,32,0.4);
  border-radius:8px;color:var(--gold);font-family:'Share Tech Mono',monospace;font-size:11px;
  letter-spacing:0.12em;cursor:pointer;transition:all .2s;}
.add-prod-btn:hover{background:rgba(232,168,32,0.18);}
.prod-list{display:flex;flex-direction:column;gap:10px;}
.prod-row{background:rgba(16,26,56,0.65);border:1px solid rgba(232,168,32,0.1);border-radius:12px;padding:16px 18px;}
.prod-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.prod-name{font-size:14px;font-weight:600;color:#edf1ff;}
.prod-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.prod-actions{display:flex;gap:8px;}
.p-btn{padding:6px 14px;border-radius:6px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;border:1px solid;transition:background .2s;}
.p-edit{background:rgba(30,61,143,0.3);border-color:rgba(30,61,143,0.6);color:#90aaff;}
.p-edit:hover{background:rgba(30,61,143,0.5);}
.p-del{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.35);color:#fca5a5;}
.p-del:hover{background:rgba(239,68,68,0.25);}
.variant-chips{display:flex;flex-wrap:wrap;gap:7px;}
.vchip{font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid rgba(232,168,32,0.2);color:var(--muted);}
.vchip .stk{margin-left:4px;font-weight:600;}
.stk-ok{color:var(--green);}
.stk-low{color:var(--orange);}
.stk-out{color:var(--red);}

/* PROD EDIT FORM */
.prod-form{background:rgba(255,255,255,0.02);border:1px solid rgba(232,168,32,0.15);border-radius:10px;padding:18px;margin-top:10px;}
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.fg{display:flex;flex-direction:column;gap:4px;}
.fg label{font-size:11px;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;}
.fg input{padding:10px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(232,168,32,0.2);
  border-radius:8px;color:#dde4f5;font-size:13px;font-family:'Inter',sans-serif;outline:none;}
.fg input:focus{border-color:rgba(232,168,32,0.5);}
.var-rows{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
.var-row{display:grid;grid-template-columns:1fr 90px 90px auto;gap:8px;align-items:center;}
.var-row input{padding:8px 10px;background:rgba(255,255,255,0.04);border:1px solid rgba(232,168,32,0.2);
  border-radius:6px;color:#dde4f5;font-size:12px;font-family:'Inter',sans-serif;outline:none;}
.rm-var{background:none;border:none;color:#3a4a6a;font-size:18px;cursor:pointer;transition:color .2s;line-height:1;}
.rm-var:hover{color:var(--red);}
.add-var-btn{width:100%;padding:8px;background:rgba(255,255,255,0.03);border:1px dashed rgba(232,168,32,0.25);
  border-radius:6px;color:var(--gold-dim);font-size:12px;cursor:pointer;transition:all .2s;}
.add-var-btn:hover{border-color:rgba(232,168,32,0.5);color:var(--gold);}
.form-actions{display:flex;gap:10px;margin-top:14px;}
.save-btn{flex:1;padding:11px;background:var(--royal);border:1px solid rgba(232,168,32,0.35);
  border-radius:8px;color:var(--gold-bright);font-family:'Share Tech Mono',monospace;font-size:11px;
  letter-spacing:0.12em;cursor:pointer;transition:background .2s;}
.save-btn:hover{background:var(--blue);}
.cancel-btn{padding:11px 18px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);
  border-radius:8px;color:var(--muted);font-size:13px;cursor:pointer;}

.empty-state{text-align:center;padding:60px;color:var(--muted);font-size:14px;}
.prod-hidden{opacity:0.55;border-color:rgba(255,255,255,0.06);}
.p-pub{background:rgba(34,197,94,0.15);border-color:rgba(34,197,94,0.5);color:#86efac;}
.p-pub:hover{background:rgba(34,197,94,0.28);}
.p-hide{background:rgba(100,100,120,0.15);border-color:rgba(150,150,180,0.3);color:#6a7a9e;}
.p-hide:hover{background:rgba(100,100,120,0.28);color:#9aa5be;}
.hidden-badge{font-size:10px;letter-spacing:0.12em;color:#4a5a7a;font-weight:500;margin-left:8px;
  background:rgba(255,255,255,0.05);padding:2px 8px;border-radius:4px;border:1px solid rgba(255,255,255,0.08);}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  background:#1e3d8f;border:1px solid rgba(232,168,32,0.3);border-radius:10px;
  padding:12px 24px;color:var(--gold-bright);font-size:13px;font-family:'Share Tech Mono',monospace;
  letter-spacing:0.1em;opacity:0;transition:opacity .3s;z-index:9999;pointer-events:none;}
.toast.show{opacity:1;}
.toast.error{background:#7f1d1d;border-color:#f87171;color:#fecaca;}
@media(max-width:700px){
  .detail-cols{grid-template-columns:1fr;}
  .var-row{grid-template-columns:1fr 70px 70px auto;}
  .form-grid-2{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<nav>
  <a href="lion-forge-shop.html" class="nav-logo">
    <img src="/logo.webp" alt="Lion Forge Peptides Logo">
    <span>LION FORGE — ADMIN</span>
  </a>
  <div class="nav-right">
    <a href="lion-forge-shop.html" class="nav-link">&#8592; Shop</a>
    <a href="lion-forge-calculator.html" class="nav-link">Calculator</a>
    <button class="signout-btn" onclick="doSignOut()">Sign out</button>
  </div>
</nav>

<!-- AUTH GATE -->
<div id="auth-gate" style="display:none;">
  <div class="auth-gate">
    <h2>ADMIN LOGIN</h2>
    <div id="a-step-email">
      <input class="auth-input" type="email" id="a-email" placeholder="Admin email" onkeydown="if(event.key==='Enter')adminRequestCode()">
      <button class="auth-btn" id="a-send-btn" onclick="adminRequestCode()">SEND CODE</button>
      <div id="a-send-status" style="min-height:18px;margin-top:8px;text-align:center;font-size:13px;color:#ef4444;"></div>
    </div>
    <div id="a-step-code" style="display:none;">
      <input class="auth-input" type="text" id="a-code" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code" onkeydown="if(event.key==='Enter')adminVerifyCode()">
      <button class="auth-btn" id="a-verify-btn" onclick="adminVerifyCode()">SIGN IN</button>
      <button class="auth-btn" style="background:none;border:none;" onclick="document.getElementById('a-step-code').style.display='none';document.getElementById('a-step-email').style.display='block';">&#8592; Use a different email</button>
      <div id="a-verify-status" style="min-height:18px;margin-top:8px;text-align:center;font-size:13px;color:#ef4444;"></div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div id="main" style="display:none;">
  <div class="tab-bar">
    <button class="tab active" onclick="switchTab('orders',this)">&#128230; Orders</button>
    <button class="tab" onclick="switchTab('products',this)">&#128138; Products &amp; Inventory</button>
    <button class="tab" onclick="switchTab('announcements',this)">&#128203; Announcements</button>
    <button class="tab" onclick="switchTab('logins',this)">&#128272; Login Activity</button>
  </div>

  <!-- ORDERS TAB -->
  <div id="tab-orders" class="tab-content active">
    <div class="stats-row">
      <div class="stat"><div class="stat-num" id="s-total">—</div><div class="stat-label">Total</div></div>
      <div class="stat"><div class="stat-num" id="s-pending" style="color:var(--orange)">—</div><div class="stat-label">Pending</div></div>
      <div class="stat"><div class="stat-num" id="s-shipped" style="color:var(--green)">—</div><div class="stat-label">Shipped</div></div>
      <div class="stat"><div class="stat-num" id="s-pickedup" style="color:#a78bfa">—</div><div class="stat-label">Picked Up</div></div>
      <div class="stat"><div class="stat-num" id="s-rev" style="color:var(--gold)">—</div><div class="stat-label">Revenue</div></div>
      <div class="stat"><div class="stat-num" id="s-cancelled" style="color:var(--red)">—</div><div class="stat-label">Cancelled</div></div>
    </div>
    <div class="filter-row">
      <input type="text" class="search-box" id="o-search" placeholder="Search name, email, order #..." oninput="filterOrders()">
      <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
      <button class="filter-btn" onclick="setFilter('pending',this)">Pending</button>
      <button class="filter-btn" onclick="setFilter('shipped',this)">Shipped</button>
      <button class="filter-btn" onclick="setFilter('picked_up',this)">Picked Up</button>
      <button class="filter-btn" onclick="setFilter('delivered',this)">Delivered</button>
      <button class="filter-btn" onclick="setFilter('cancelled',this)">Cancelled</button>
    </div>
    <div id="order-list" class="order-list"><div class="empty-state">Loading orders...</div></div>

    <!-- CANCELLED ORDERS PANEL -->
    <div class="cancelled-panel" id="cancelled-panel">
      <div class="cancelled-panel-hdr" onclick="toggleCancelledPanel()">
        <h3>&#x26D4; CANCELLED ORDERS</h3>
        <div style="display:flex;align-items:center;gap:12px;">
          <span id="cancelled-panel-count" style="font-size:12px;color:var(--muted);font-family:'Share Tech Mono',monospace;"></span>
          <span id="cancelled-chev" style="color:var(--muted);font-size:11px;transition:transform .25s;">&#9660;</span>
        </div>
      </div>
      <div class="cancelled-panel-body" id="cancelled-list" style="display:none;"></div>
    </div>
  </div>

  <!-- PRODUCTS TAB -->
  <div id="tab-products" class="tab-content">
    <div class="prod-toolbar">
      <h2>PRODUCTS &amp; INVENTORY</h2>
      <button class="add-prod-btn" onclick="openAddForm()">+ ADD NEW PRODUCT</button>
    </div>
    <div id="prod-form-container"></div>
    <div id="prod-list" class="prod-list"><div class="empty-state">Loading...</div></div>
  </div>

  <!-- ANNOUNCEMENTS TAB -->
  <div id="tab-logins" class="tab-content">
          <div id="login-events-list"><div class="empty-state">Click the Login Activity tab to load.</div></div>
        </div>
        <div id="tab-announcements" class="tab-content">
    <div class="prod-toolbar">
      <h2>ANNOUNCEMENTS</h2>
      <button class="add-prod-btn" onclick="toggleAnnForm()">+ NEW ANNOUNCEMENT</button>
    </div>
    <div id="ann-form" style="display:none;background:rgba(255,255,255,0.02);border:1px solid rgba(232,168,32,0.2);border-radius:10px;padding:18px;margin-bottom:18px;">
      <div class="fg" style="margin-bottom:12px;">
        <label>MESSAGE</label>
        <textarea id="ann-msg" rows="3" style="padding:10px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(232,168,32,0.2);border-radius:8px;color:#dde4f5;font-size:13px;font-family:'Inter',sans-serif;outline:none;resize:vertical;width:100%;" placeholder="Write your announcement..."></textarea>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button class="cancel-btn" onclick="toggleAnnForm()">Cancel</button>
        <button class="save-btn" style="flex:0;padding:11px 20px;" onclick="saveAnnouncement(false)">SAVE DRAFT</button>
        <button class="save-btn" style="flex:0;padding:11px 20px;background:rgba(34,197,94,0.25);border-color:rgba(34,197,94,0.5);color:#86efac;" onclick="saveAnnouncement(true)">PUBLISH NOW</button>
      </div>
    </div>
    <div id="ann-list"><div class="empty-state">Loading announcements...</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let allOrders = [];
let currentFilter = 'all';

// ── AUTH ─────────────────────────────────────────────────────────
(async function() {
  try {
    const r = await fetch('/api/auth/me', { credentials: 'include' });
    if (!r.ok) throw new Error();
    const user = await r.json();
    if (user.role !== 'admin') throw new Error();
    window._lfCurrentUser = user;
    document.getElementById('auth-gate').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    loadOrders();
    loadProducts();
  } catch(e) {
    document.getElementById('auth-gate').style.display = 'block';
    document.getElementById('main').style.display = 'none';
  }
})();

window.adminRequestCode = async function() {
  const email = document.getElementById('a-email').value.trim();
  const statusEl = document.getElementById('a-send-status');
  statusEl.textContent = '';
  if (!email || !email.includes('@')) { statusEl.textContent = 'Please enter a valid email address.'; return; }
  const btn = document.getElementById('a-send-btn');
  btn.disabled = true; btn.textContent = 'Sending...';
  try {
    const r = await fetch('/api/auth/request-code', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Failed to send code');
    document.getElementById('a-step-email').style.display = 'none';
    document.getElementById('a-step-code').style.display = 'block';
    document.getElementById('a-code').value = '';
    document.getElementById('a-code').focus();
  } catch(err) {
    statusEl.textContent = err.message || 'Something went wrong. Try again.';
  } finally {
    btn.disabled = false; btn.textContent = 'SEND CODE';
  }
};

window.adminVerifyCode = async function() {
  const email = document.getElementById('a-email').value.trim();
  const code = document.getElementById('a-code').value.trim();
  const statusEl = document.getElementById('a-verify-status');
  statusEl.textContent = '';
  if (code.length !== 6) { statusEl.textContent = 'Please enter the 6-digit code.'; return; }
  const btn = document.getElementById('a-verify-btn');
  btn.disabled = true; btn.textContent = 'Verifying...';
  try {
    const r = await fetch('/api/auth/verify-code', { method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email, code }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Invalid code');
    if (d.role !== 'admin') { await fetch('/api/auth/logout',{method:'POST',credentials:'include'}); throw new Error('Not an admin account'); }
    window._lfCurrentUser = d;
    document.getElementById('auth-gate').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    loadOrders(); loadProducts();
  } catch(err) {
    btn.disabled = false; btn.textContent = 'SIGN IN';
    statusEl.textContent = err.message;
  }
};
window.doSignOut = function() {
  fetch('/api/auth/logout', { method: 'POST', credentials: 'include' })
    .finally(() => { window.location.href = 'index.html'; });
};

// ── TABS ─────────────────────────────────────────────────────────
window.switchTab = function(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const el = document.getElementById('tab-' + name);
  if (el) el.classList.add('active');
  if (name === 'announcements') loadAnnouncements();
  if (name === 'logins') loadLoginEvents();
};

// ══════════════════════════════════════════════════════════════════
// ORDERS
// ══════════════════════════════════════════════════════════════════
async function loadOrders() {
  try {
    const r = await fetch('/api/admin/orders', { credentials: 'include' });
    allOrders = (await r.json()).map(o => ({ fid: o.id, ...o }));
    allOrders.sort((a,b) => (b.orderNum||0) - (a.orderNum||0));
    updateStats(); filterOrders(); renderCancelledOrders();
  } catch(e) {
    document.getElementById('order-list').innerHTML = '<div class="empty-state">Error: ' + e.message + '</div>';
  }
}

function updateStats() {
  document.getElementById('s-total').textContent   = allOrders.length;
  document.getElementById('s-pending').textContent = allOrders.filter(o=>o.status==='pending'||o.status==='processing').length;
  document.getElementById('s-shipped').textContent = allOrders.filter(o=>o.status==='shipped'||o.status==='delivered').length;
  document.getElementById('s-pickedup').textContent = allOrders.filter(o=>o.status==='picked_up').length;
  document.getElementById('s-rev').textContent     = '$'+allOrders.reduce((s,o)=>s+(o.total||0),0).toFixed(0);
  document.getElementById('s-cancelled').textContent = allOrders.filter(o=>o.status==='cancelled').length;
}

window.setFilter = function(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); filterOrders();
};
window.filterOrders = function() {
  const q = document.getElementById('o-search').value.toLowerCase();
  let list;
  if (currentFilter === 'cancelled') {
    list = allOrders.filter(o => o.status === 'cancelled');
  } else if (currentFilter === 'all') {
    list = allOrders.filter(o => o.status !== 'cancelled');
  } else {
    list = allOrders.filter(o => o.status === currentFilter);
  }
  if (q) list = list.filter(o=>(o.order_num+'').includes(q)||(o.display_name||'').toLowerCase().includes(q)||(o.email||'').toLowerCase().includes(q));
  renderOrders(list);
};

function renderOrders(orders) {
  const el = document.getElementById('order-list');
  if (!orders.length) { el.innerHTML='<div class="empty-state">No orders found.</div>'; return; }
  el.innerHTML = orders.map(o => {
    const isShipped = o.status==='shipped'||o.status==='delivered';
    const isCancelled = o.status==='cancelled';
    const isPickedUp = o.status==='picked_up';
    const isPaymentConfirmed = !!o.payment_confirmed;
    const pillClass = 'pill-'+(o.status||'pending');
    const date = o.date ? new Date(o.date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
    const items = (o.items||[]).map(i=>`<div>${i.name} (${i.variant}) x${i.qty} — <strong>$${(i.price*i.qty).toFixed(2)}</strong></div>`).join('');
    // Universal shipping panel
    const cancelDate = o.cancelled_at ? new Date(o.cancelled_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '';
    const pickedUpDate = o.shipped_at ? new Date(o.shipped_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '';
    const trackPanel = `<div class="track-panel" style="${isCancelled ? 'border-color:rgba(239,68,68,0.2);' : ''}">
      ${isCancelled ? `<div style="margin-bottom:12px;padding:10px 14px;background:rgba(239,68,68,0.07);border-radius:8px;"><span style="color:var(--red);font-weight:600;">&#x26D4; Cancelled</span>${cancelDate ? ' &mdash; '+cancelDate : ''}${o.cancel_reason ? ' &mdash; <em style=color:#fca5a5>'+o.cancel_reason+'</em>' : ''}</div>` : ''}
      ${isPickedUp ? `<div style="margin-bottom:12px;padding:10px 14px;background:rgba(167,139,250,0.07);border-radius:8px;"><span style="color:#a78bfa;font-weight:600;">&#x1F91D; Picked Up in Person</span>${pickedUpDate ? ' &mdash; '+pickedUpDate : ''}</div>` : ''}
      ${(isPaymentConfirmed && o.status==='pending') ? `<div style="margin-bottom:12px;padding:10px 14px;background:rgba(249,115,22,0.07);border-radius:8px;"><span style="color:var(--orange);font-weight:600;">&#x26A0; Payment confirmed, label purchase pending</span> &mdash; will retry automatically, or use Create Label below to retry now.</div>` : ''}
      ${o.tracking_number ? `<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:6px;"><span style="font-size:11px;color:#6a7a9e;">Shipping notification sent to customer?</span><button onclick="resendShippingEmail('${o.fid}')" style="background:none;border:1px solid rgba(232,168,32,0.3);border-radius:6px;padding:4px 12px;color:#e8a820;font-size:11px;cursor:pointer;">&#9993; Resend Shipping Email</button></div>` : ''}
      ${o.tracking_number ? `<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:12px 14px;background:rgba(34,197,94,0.07);border:1px solid rgba(34,197,94,0.25);border-radius:8px;flex-wrap:wrap;"><div style="flex:1;min-width:180px;"><div style="font-size:10px;color:#6a7a9e;letter-spacing:0.12em;margin-bottom:3px;">TRACKING &mdash; ${o.carrier||'USPS'}</div><div style="font-family:'Share Tech Mono',monospace;font-size:15px;color:#22c55e;letter-spacing:0.05em;">${o.tracking_number}</div></div>${o.label_url ? `<a href="${o.label_url}" target="_blank" style="padding:8px 16px;background:#22c55e;border-radius:8px;color:#080e20;font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap;font-family:'Share Tech Mono',monospace;letter-spacing:0.08em;">&#x2B07; DOWNLOAD LABEL</a>` : '<span style="font-size:12px;color:#6a7a9e;">No label stored</span>'}</div>` : ''}
      ${(!isPaymentConfirmed && o.status==='pending') ? `<div style="margin-bottom:12px;padding:10px 14px;background:rgba(34,197,94,0.06);border:1px solid rgba(34,197,94,0.2);border-radius:8px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;"><span style="font-size:12px;color:#6a7a9e;">Payment received (Venmo/Zelle/etc)?</span><button onclick="confirmPayment('${o.fid}')" style="padding:8px 16px;background:#22c55e;border:none;border-radius:8px;color:#080e20;font-family:'Share Tech Mono',monospace;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:0.08em;white-space:nowrap;">&#x2713; CONFIRM PAYMENT</button></div>` : ''}
      ${!isPickedUp ? `<div style="margin-bottom:12px;padding:10px 14px;background:rgba(167,139,250,0.06);border:1px solid rgba(167,139,250,0.2);border-radius:8px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;"><span style="font-size:12px;color:#6a7a9e;">Picked up in person instead of shipping?</span><button onclick="markPickedUp('${o.fid}')" style="padding:8px 16px;background:#a78bfa;border:none;border-radius:8px;color:#080e20;font-family:'Share Tech Mono',monospace;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:0.08em;white-space:nowrap;">&#x1F91D; MARK PICKED UP</button></div>` : ''}
      <h4>${o.tracking_number ? 'Recreate Label' : 'Create Label'}</h4>
      <div style="margin-bottom:12px;padding:10px;background:rgba(34,197,94,0.06);border:1px solid rgba(34,197,94,0.2);border-radius:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;"><div class="tf" style="flex:1;min-width:120px;"><label>Weight (oz)</label><input id="weight-${o.fid}" type="number" min="1" max="160" value="8" style="width:100%;"></div><button onclick="createLabel('${o.fid}')" id="label-btn-${o.fid}" style="padding:10px 18px;background:#22c55e;border:none;border-radius:8px;color:#080e20;font-family:'Share Tech Mono',monospace;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:0.1em;white-space:nowrap;">&#x1F4E6; ${o.tracking_number ? 'RECREATE LABEL' : 'CREATE LABEL'}</button><span id="label-result-${o.fid}" style="font-size:12px;color:#22c55e;"></span></div>
      <div class="track-fields"><div class="tf"><label>Carrier</label><select id="carrier-${o.fid}"><option>USPS</option><option>UPS</option><option>FedEx</option><option>DHL</option></select></div><div class="tf" style="flex:2;"><label>Tracking Number</label><input id="tracking-${o.fid}" type="text" placeholder="Enter tracking #" value="${o.tracking_number||''}"></div><button class="ship-btn" onclick="markShipped('${o.fid}','${o.email}','${o.display_name||''}','${o.order_num}')">MARK SHIPPED &#x2192;</button></div>
      ${(!isCancelled && !isPickedUp) ? `<div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.05);display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;"><div class="tf" style="flex:2;min-width:160px;"><label>Cancel Reason (optional)</label><input id="cancel-reason-${o.fid}" type="text" placeholder="e.g. Customer request, out of stock..."></div><button class="cancel-order-btn" onclick="cancelOrder('${o.fid}','${o.order_num}')">&#x26D4; CANCEL ORDER</button></div>` : ''}
    </div>`;

        return `<div class="order-card ${o.status||'pending'}" id="oc-${o.fid}">
      <div class="order-head" onclick="toggleOrder('${o.fid}')">
        <div class="order-head-left">
          <span class="order-num">#${o.order_num}</span>
          <div><div class="cust-name">${o.display_name||'Unknown'}</div>
            <div class="cust-email">${o.email||''} &bull; ${date}</div>
          </div>
        </div>
        <div class="order-head-right">
          <span class="status-pill ${pillClass}">${(o.status||'pending').replace('_',' ').toUpperCase()}</span>
          <span class="order-amt">$${(o.total||0).toFixed(2)}</span>
          <span class="chevron" id="chev-${o.fid}">&#9660;</span>
        </div>
      </div>
      <div class="order-detail" id="detail-${o.fid}">
        <div class="detail-cols">
          <div><h4>Items</h4><div class="items-block">${items}</div></div>
          <div><h4>Details</h4>
            <div class="detail-row"><span>Shipping</span><span>${o.shipping_method||'Ground'} $${(o.shipping||10).toFixed(2)}</span></div>
            <div class="detail-row"><span>Payment</span><span>${o.payment_method||'—'}</span></div>
            <div class="detail-row"><span>Ship to</span><span>${o.address||'—'}</span></div>
            <div class="detail-row"><span>Email</span><span>${o.email||'—'}</span></div>
            <div class="detail-row"><span>Total</span><span>$${(o.total||0).toFixed(2)}</span></div>
          </div>
        </div>
        ${trackPanel}
      </div>
    </div>`;
  }).join('');
}

window.toggleOrder = function(id) {
  document.getElementById('detail-'+id)?.classList.toggle('open');
  document.getElementById('chev-'+id)?.classList.toggle('open');
};

window.showRelabelPanel = function(fid) {
  var p = document.getElementById('relabel-'+fid);
  if (p) p.style.display = p.style.display === 'none' ? 'block' : 'none';
};
window.relabelOrder = async function(fid) {
  var weightOz = parseFloat(document.getElementById('relabel-weight-'+fid)?.value) || 8;
  var result = document.getElementById('relabel-result-'+fid);
  if (result) result.textContent = 'Creating...';
  try {
    var r = await fetch('/api/admin/orders/'+fid+'/create-label', {
      method:'POST', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ weightOz: weightOz })
    });
    var d = await r.json();
    if (!r.ok) throw new Error(d.error||'Failed');
    if (result) result.innerHTML = '<a href="'+d.labelUrl+'" target="_blank" style="color:#22c55e;text-decoration:underline;">&#x2B07; Download New Label</a> — '+d.tracking;
    var order = allOrders.find(function(o){return o.fid===fid;});
    if (order) { order.tracking_number=d.tracking; order.carrier=d.carrier; order.label_url=d.labelUrl; }
    showToast('New label created: '+d.tracking);
  } catch(e) { if(result) result.textContent = 'Error: '+e.message; }
};
window.createLabel = async function(fid) {
  var weightOz = parseFloat(document.getElementById('weight-'+fid)?.value) || 8;
  var btn = document.getElementById('label-btn-'+fid);
  var result = document.getElementById('label-result-'+fid);
  if (btn) { btn.disabled=true; btn.textContent='Creating...'; }
  try {
    var r = await fetch('/api/admin/orders/'+fid+'/create-label', {
      method:'POST', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ weightOz: weightOz })
    });
    var d = await r.json();
    if (!r.ok) throw new Error(d.error||'Label creation failed');
    var trackInput = document.getElementById('tracking-'+fid);
    if (trackInput) trackInput.value = d.tracking;
    if (result) result.innerHTML = '<a href="'+d.labelUrl+'" target="_blank" style="color:#22c55e;text-decoration:underline;">\u{1F4E5} Download Label</a> &mdash; '+d.tracking;
    if (btn) { btn.disabled=false; btn.textContent='✓ Done'; }
    var order = allOrders.find(function(o){return o.fid===fid;});
    if (order) { order.status='shipped'; order.tracking_number=d.tracking; order.carrier=d.carrier; order.label_url=d.labelUrl||''; }
    updateStats(); filterOrders();
    showToast('Shipped: ' + d.tracking + ' via ' + d.carrier);
  } catch(e) {
    if (btn) { btn.disabled=false; btn.textContent='\u{1F4E6} CREATE LABEL'; }
    alert('Error: '+e.message);
  }
};
window.markShipped = async function(fid, email, name, orderNum) {
  const carrier  = document.getElementById('carrier-'+fid)?.value;
  const tracking = document.getElementById('tracking-'+fid)?.value.trim();
  if (!tracking) { alert('Please enter a tracking number.'); return; }
  const btn = document.querySelector(`#oc-${fid} .ship-btn`);
  if (btn) { btn.disabled=true; btn.textContent='Updating...'; }
  try {
    const r = await fetch('/api/admin/orders/'+fid, { method:'PUT', credentials:'include', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ status:'shipped', carrier, trackingNumber:tracking, shippedAt:new Date().toISOString() }) }); if (!r.ok) throw new Error('Update failed');
    // The server sends the customer shipping notification via Resend.
    const order = allOrders.find(o=>o.fid===fid);
    if (order) { order.status='shipped'; order.carrier=carrier; order.tracking_number=tracking; }
    updateStats(); filterOrders();
    showToast('Marked shipped + email sent!');
  } catch(e) { console.error(e); alert('Error: '+e.message); if(btn){btn.disabled=false;btn.textContent='MARK SHIPPED →';} }
};
window.confirmPayment = async function(fid) {
  if (!confirm('Confirm payment received? This will immediately buy a USPS label and mark the order shipped.')) return;
  try {
    const r = await fetch('/api/admin/orders/'+fid+'/confirm-payment', { method:'POST', credentials:'include' });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error||'Failed');
    const order = allOrders.find(o=>o.fid===fid);
    if (order) {
      order.payment_confirmed = 1;
      if (d.shipped) { order.status='shipped'; order.carrier=d.carrier; order.tracking_number=d.tracking; order.label_url=d.labelUrl||''; }
    }
    updateStats(); filterOrders();
    showToast(d.shipped ? 'Payment confirmed — shipped! '+d.tracking : 'Payment confirmed — label purchase failed, will retry automatically.');
  } catch(e) { console.error(e); alert('Error: '+e.message); }
};
window.markPickedUp = async function(fid) {
  if (!confirm('Mark this order as picked up in person? No shipping email will be sent.')) return;
  try {
    const pickedUpAt = new Date().toISOString();
    const r = await fetch('/api/admin/orders/'+fid, { method:'PUT', credentials:'include', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ status:'picked_up', shippedAt:pickedUpAt }) });
    if (!r.ok) throw new Error('Update failed');
    const order = allOrders.find(o=>o.fid===fid);
    if (order) { order.status='picked_up'; order.shipped_at=pickedUpAt; }
    updateStats(); filterOrders();
    showToast('Marked picked up!');
  } catch(e) { console.error(e); alert('Error: '+e.message); }
};
window.resendShippingEmail = async function(fid) {
  try {
    const r = await fetch('/api/admin/orders/'+fid+'/resend-shipping-email', { method:'POST', credentials:'include' });
    if (!r.ok) throw new Error('Failed');
    showToast('Shipping email resent!');
  } catch(e) { alert('Error: '+e.message); }
};

window.cancelOrder = async function(fid, orderNum) {
  if (!confirm('Cancel order #'+orderNum+'? This action cannot be undone.')) return;
  const reason = document.getElementById('cancel-reason-'+fid)?.value.trim() || '';
  try {
    const rc = await fetch('/api/admin/orders/'+fid, { method:'PUT', credentials:'include', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ status:'cancelled', cancelReason: reason, cancelledAt: new Date().toISOString() }) }); if (!rc.ok) throw new Error('Update failed');
    const order = allOrders.find(o=>o.fid===fid);
    if (order) { order.status='cancelled'; order.cancelReason=reason; order.cancelledAt=new Date().toISOString(); }
    updateStats(); filterOrders(); renderCancelledOrders();
    // Auto-open the cancelled panel so admin sees the result
    const body = document.getElementById('cancelled-list');
    if (body && body.style.display === 'none') {
      body.style.display = 'block';
      const chev = document.getElementById('cancelled-chev');
      if (chev) chev.style.transform = '';
    }
    showToast('&#x26D4; Order #'+orderNum+' cancelled');
  } catch(e) { alert('Error: '+e.message); }
};

function renderCancelledOrders() {
  const cancelled = allOrders.filter(o => o.status === 'cancelled');
  const countEl = document.getElementById('cancelled-panel-count');
  const listEl = document.getElementById('cancelled-list');
  if (countEl) countEl.textContent = cancelled.length + ' order' + (cancelled.length !== 1 ? 's' : '');
  if (!listEl) return;
  if (!cancelled.length) {
    listEl.innerHTML = '<div class="empty-state" style="padding:30px;">No cancelled orders.</div>';
    return;
  }
  listEl.innerHTML = cancelled.map(o => {
    const date = o.date ? new Date(o.date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
    const cancelDate = o.cancelled_at ? new Date(o.cancelled_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
    const items = (o.items||[]).map(i=>`<div>${i.name} (${i.variant}) x${i.qty} — <strong>$${(i.price*i.qty).toFixed(2)}</strong></div>`).join('');
    return `<div class="order-card cancelled" id="cc-${o.fid}" style="margin:0 12px 10px;">
      <div class="order-head" onclick="toggleCancelledOrder('${o.fid}')">
        <div class="order-head-left">
          <span class="order-num">#${o.order_num}</span>
          <div><div class="cust-name">${o.display_name||'Unknown'}</div>
            <div class="cust-email">${o.email||''} &bull; Ordered ${date}</div>
          </div>
        </div>
        <div class="order-head-right">
          <span class="status-pill pill-cancelled">CANCELLED</span>
          <span class="order-amt" style="color:var(--muted);text-decoration:line-through;">$${(o.total||0).toFixed(2)}</span>
          <span class="chevron" id="cchev-${o.fid}">&#9660;</span>
        </div>
      </div>
      <div class="order-detail" id="cdetail-${o.fid}">
        <div class="detail-cols">
          <div><h4>Items</h4><div class="items-block">${items}</div></div>
          <div><h4>Details</h4>
            <div class="detail-row"><span>Shipping</span><span>${o.shipping_method||'Ground'} $${(o.shipping||10).toFixed(2)}</span></div>
            <div class="detail-row"><span>Payment</span><span>${o.payment_method||'—'}</span></div>
            <div class="detail-row"><span>Ship to</span><span>${o.address||'—'}</span></div>
            <div class="detail-row"><span>Email</span><span>${o.email||'—'}</span></div>
            <div class="detail-row"><span>Order Total</span><span>$${(o.total||0).toFixed(2)}</span></div>
          </div>
        </div>
        <div class="track-panel" style="border-color:rgba(239,68,68,0.2);">
          <h4 style="color:var(--red);">&#x26D4; Cancellation Details</h4>
          <div style="font-size:13px;color:#fca5a5;">Cancelled on ${cancelDate}${o.cancel_reason ? ' &mdash; <em>' + o.cancel_reason + '</em>' : ' &mdash; No reason provided'}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

window.toggleCancelledOrder = function(id) {
  document.getElementById('cdetail-'+id)?.classList.toggle('open');
  document.getElementById('cchev-'+id)?.classList.toggle('open');
};

window.toggleCancelledPanel = function() {
  const body = document.getElementById('cancelled-list');
  const chev = document.getElementById('cancelled-chev');
  const isHidden = body.style.display === 'none';
  body.style.display = isHidden ? 'block' : 'none';
  if (chev) chev.style.transform = isHidden ? '' : 'rotate(-90deg)';

// ══════════════════════════════════════════════════════════════════
// PRODUCTS
// ══════════════════════════════════════════════════════════════════
let products = [];
let editingId = null;

async function loadProducts() {
  try {
    const r = await fetch('/api/admin/products', { credentials: 'include' });
    const d = await r.json();
    products = d.list || [];
    renderProducts();
  } catch(e) {
    console.error('Products load error:',e);
    const detail = (e && e.code === 'permission-denied') ? 'permission denied' : (e && e.message ? e.message : 'unknown error');
    showToast('&#9888; COULD NOT LOAD products from database ('+detail+') &mdash; showing defaults, edits will not save', 'error');
    products = getDefaultProducts();
    renderProducts();
  }
}

async function saveProductsToDB() {
  try {
    const r = await fetch('/api/admin/products', { method:'PUT', credentials:'include', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ list: products }) }); if (!r.ok) throw new Error('Save failed');
    return true;
  } catch(e) {
    console.error('Save failed:', e);
    const detail = (e && e.code === 'permission-denied')
      ? 'permission denied'
      : (e && e.message ? e.message : 'unknown error');
    showToast('&#9888; SAVE FAILED &mdash; changes were NOT stored ('+detail+')', 'error');
    return false;
  }
}

function renderProducts() {
  const el = document.getElementById('prod-list');
  if (!products.length) { el.innerHTML='<div class="empty-state">No products.</div>'; return; }
  let html = '';
  products.forEach(function(p) {
    const chips = p.variants.map(function(v) {
      const cls = v.stock===0 ? 'stk-out' : v.stock<=3 ? 'stk-low' : 'stk-ok';
      const stk = v.stock===0 ? 'Out' : v.stock>=100 ? 'In stock' : v.stock+' left';
      return '<div class="vchip">'+v.label+' &mdash; <strong>$'+v.price.toFixed(2)+'</strong> &mdash; <span class="stk '+cls+'">'+stk+'</span></div>';
    }).join('');
    const isHidden = p.hidden === true;
    const badge    = isHidden ? ' <span class="hidden-badge">HIDDEN</span>' : '';
    const rowCls   = isHidden ? 'prod-row prod-hidden' : 'prod-row';
    const subtitle = p.subtitle ? '<div class="prod-sub">'+p.subtitle+'</div>' : '';
    const visBtn   = isHidden
      ? '<button class="p-btn p-pub" onclick="setProductVisibility('+p.id+',false)">&#10003; Publish</button>'
      : '<button class="p-btn p-hide" onclick="setProductVisibility('+p.id+',true)">&#128065; Hide</button>';
    html += '<div class="'+rowCls+'" id="pr-'+p.id+'">'
          +   '<div class="prod-row-top">'
          +     '<div><div class="prod-name">'+p.name+badge+'</div>'+subtitle+'</div>'
          +     '<div class="prod-actions">'+visBtn
          +       '<button class="p-btn p-edit" onclick="openEditForm('+p.id+')">Edit</button>'
          +       '<button class="p-btn p-del" onclick="deleteProduct('+p.id+')">Delete</button>'
          +     '</div>'
          +   '</div>'
          +   '<div class="variant-chips">'+chips+'</div>'
          + '</div>';
  });
  el.innerHTML = html;
}

window.openAddForm = function() { editingId=null; renderForm(null); };
window.openEditForm = function(id) {
  editingId = id;
  renderForm(products.find(p=>p.id===id));
  document.getElementById('pr-'+id)?.scrollIntoView({behavior:'smooth',block:'nearest'});
};
window.deleteProduct = async function(id) {
  if (!confirm('Delete this product?')) return;
  const backup = products.slice();
  products = products.filter(p=>p.id!==id);
  const ok = await saveProductsToDB();
  if (!ok) { products = backup; renderProducts(); return; }
  renderProducts();
  document.getElementById('prod-form-container').innerHTML='';
  showToast('Product deleted');
};

function renderForm(p) {
  const isEdit = !!p;
  const vars = p ? p.variants : [{label:'',price:0,stock:0}];
  const varRows = vars.map((v,i)=>`
    <div class="var-row" id="vr-${i}">
      <input type="text" placeholder="Label e.g. 10MG" value="${v.label}" id="vl-${i}">
      <input type="number" placeholder="Price" value="${v.price}" id="vp-${i}" step="0.01" min="0">
      <input type="number" placeholder="Stock" value="${v.stock}" id="vs-${i}" min="0">
      <button class="rm-var" onclick="document.getElementById('vr-${i}').remove()">&#x2715;</button>
    </div>`).join('');
  document.getElementById('prod-form-container').innerHTML=`
    <div class="prod-form" id="edit-form">
      <div style="font-size:12px;color:var(--gold);font-family:'Share Tech Mono',monospace;letter-spacing:0.15em;margin-bottom:14px;">${isEdit?'EDIT PRODUCT':'NEW PRODUCT'}</div>
      <div class="form-grid-2">
        <div class="fg"><label>Product Name</label><input id="f-pname" type="text" value="${p?p.name:''}" placeholder="e.g. SEMAGLUTIDE"></div>
        <div class="fg"><label>Subtitle (optional)</label><input id="f-psub" type="text" value="${p?p.subtitle:''}" placeholder="e.g. Blend description"></div>
      </div>
      <div style="font-size:11px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:8px;">Variants — Label / Price / Stock</div>
      <div class="var-rows" id="var-rows">${varRows}</div>
      <button class="add-var-btn" onclick="addVarRow()">+ Add Variant</button>
      <div class="form-actions">
        <button class="save-btn" onclick="saveProduct(${p?p.id:'null'})">${isEdit?'SAVE CHANGES':'ADD PRODUCT'}</button>
        <button class="cancel-btn" onclick="document.getElementById('prod-form-container').innerHTML=''">Cancel</button>
      </div>
    </div>`;
  document.getElementById('edit-form').scrollIntoView({behavior:'smooth',block:'nearest'});
}

window.addVarRow = function() {
  const rows = document.getElementById('var-rows');
  const i = rows.children.length;
  const div = document.createElement('div');
  div.className='var-row'; div.id='vr-'+i;
  div.innerHTML=`<input type="text" placeholder="Label" id="vl-${i}">
    <input type="number" placeholder="Price" id="vp-${i}" step="0.01" min="0">
    <input type="number" placeholder="Stock" id="vs-${i}" min="0">
    <button class="rm-var" onclick="this.parentElement.remove()">&#x2715;</button>`;
  rows.appendChild(div);
};

window.setProductVisibility = async function(id, hide) {
  const idx = products.findIndex(p => p.id === id);
  if (idx < 0) return;
  const prev = products[idx].hidden;
  products[idx].hidden = hide;
  const ok = await saveProductsToDB();
  if (!ok) { products[idx].hidden = prev; renderProducts(); return; }
  renderProducts();
  showToast(hide ? '&#128065; Product hidden from shop' : '&#10003; Product published to shop');
};

window.saveProduct = async function(pid) {
  const name = document.getElementById('f-pname').value.trim();
  const sub  = document.getElementById('f-psub').value.trim();
  if (!name) { alert('Product name required'); return; }
  const rows = document.getElementById('var-rows').children;
  const variants = [];
  for (const row of rows) {
    const lbl = row.querySelector('input[type="text"]')?.value.trim();
    const prc = parseFloat(row.querySelectorAll('input[type="number"]')[0]?.value)||0;
    const stk = parseInt(row.querySelectorAll('input[type="number"]')[1]?.value)||0;
    if (lbl) variants.push({label:lbl,price:prc,stock:stk});
  }
  if (!variants.length) { alert('Add at least one variant'); return; }
  const backup = products.slice();
  let action;
  if (pid==='null'||pid===null) {
    const newId = Math.max(0,...products.map(p=>p.id))+1;
    products.push({id:newId,name,subtitle:sub,variants});
    action = 'Product added!';
  } else {
    const idx = products.findIndex(p=>p.id===pid);
    if (idx>=0) products[idx] = {...products[idx],name,subtitle:sub,variants};
    action = 'Product updated!';
  }
  const ok = await saveProductsToDB();
  if (!ok) { products = backup; renderProducts(); return; }
  renderProducts();
  document.getElementById('prod-form-container').innerHTML='';
  showToast(action);
};

// ══════════════════════════════════════════════════════════════════
// ANNOUNCEMENTS
// ══════════════════════════════════════════════════════════════════
let announcements = [];

async function loadAnnouncements() {
  const container = document.getElementById('ann-list');
  if (!container) return;
  container.innerHTML = '<div class="empty-state">Loading...</div>';
  try {
    const r = await fetch('/api/admin/announcements', { credentials: 'include' });
    announcements = await r.json();
  } catch(e) {
    announcements = [];
  }
  renderAnnouncements();
}

function renderAnnouncements() {
  const container = document.getElementById('ann-list');
  if (!container) return;
  if (!announcements.length) {
    container.innerHTML = '<div class="empty-state">No announcements yet. Create your first one above.</div>';
    return;
  }
  container.innerHTML = announcements.map(a => {
    const isLive = !!a.published;
    const dateStr = a.created_at
      ? new Date(a.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
      : 'Recently';
    return `<div class="prod-row" id="ann-row-${a.id}" style="${isLive ? '' : 'opacity:0.55;'}">
      <div class="prod-row-top">
        <div>
          <div class="prod-name" style="font-size:13px;font-weight:400;line-height:1.5;">${a.content || a.title || ''}</div>
          <div class="prod-sub" style="margin-top:6px;display:flex;align-items:center;gap:8px;">
            <span style="width:7px;height:7px;border-radius:50%;display:inline-block;background:${isLive ? 'var(--green)' : '#3a4a6a'};"></span>
            <span>${isLive ? 'Live' : 'Draft'} &mdash; ${dateStr}</span>
          </div>
        </div>
        <div class="prod-actions">
          <button class="p-btn ${isLive ? 'p-hide' : 'p-pub'}" onclick="toggleAnnouncement('${a.id}', ${isLive})">
            ${isLive ? 'Unpublish' : 'Publish'}
          </button>
          <button class="p-btn p-del" onclick="deleteAnnouncement('${a.id}')">Delete</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

window.toggleAnnForm = function() {
  const f = document.getElementById('ann-form');
  f.style.display = f.style.display === 'none' ? 'block' : 'none';
  if (f.style.display === 'block') document.getElementById('ann-msg').focus();
};

window.saveAnnouncement = async function(publish) {
  const msg = document.getElementById('ann-msg').value.trim();
  if (!msg) { alert('Please write an announcement message.'); return; }
  try {
    const r = await fetch('/api/admin/announcements', { method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ title: msg, content: msg, published: publish }) }); if (!r.ok) throw new Error('Save failed');
    document.getElementById('ann-msg').value = '';
    document.getElementById('ann-form').style.display = 'none';
    showToast(publish ? '&#10003; Announcement published!' : '&#128393; Draft saved');
    loadAnnouncements();
  } catch(e) { alert('Error saving: ' + e.message); }
};

window.toggleAnnouncement = async function(id, isLive) {
  try {
    const r = await fetch('/api/admin/announcements/'+id, { method:'PUT', credentials:'include', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ title: announcements.find(a=>a.id===id)?.title||'', content: announcements.find(a=>a.id===id)?.content||'', published: !isLive }) }); if (!r.ok) throw new Error('Update failed');
    showToast(isLive ? '&#128065; Unpublished' : '&#10003; Published!');
    loadAnnouncements();
  } catch(e) { alert('Error: ' + e.message); }
};

window.deleteAnnouncement = async function(id) {
  if (!confirm('Delete this announcement?')) return;
  try {
    const r = await fetch('/api/admin/announcements/'+id, { method:'DELETE', credentials:'include' }); if (!r.ok) throw new Error('Delete failed');
    showToast('Announcement deleted');
    loadAnnouncements();
  } catch(e) { alert('Error: ' + e.message); }
};

async function loadLoginEvents() {
  const el = document.getElementById('login-events-list');
  el.innerHTML = '<div class="empty-state">Loading...</div>';
  try {
    const r = await fetch('/api/admin/login-events', { credentials: 'include' });
    const events = await r.json();
    if (!events.length) { el.innerHTML = '<div class="empty-state">No login events yet.</div>'; return; }
    const eventColors = { login_success: '#22c55e', login_failed: '#ef4444', code_requested: '#e8a820' };
    const eventLabels = { login_success: '✓ Signed In', login_failed: '✗ Failed Code', code_requested: '⟳ Code Sent' };
    el.innerHTML = '<table style="width:100%;border-collapse:collapse;font-size:13px;">'
      + '<thead><tr style="border-bottom:1px solid rgba(255,255,255,0.08);">'
      + '<th style="text-align:left;padding:8px;color:#6a7a9e;">Time</th>'
      + '<th style="text-align:left;padding:8px;color:#6a7a9e;">Email</th>'
      + '<th style="text-align:left;padding:8px;color:#6a7a9e;">Event</th>'
      + '</tr></thead><tbody>'
      + events.map(function(e) {
          var d = new Date(e.created_at + 'Z').toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
          var color = eventColors[e.event] || '#6a7a9e';
          var label = eventLabels[e.event] || e.event;
          return '<tr style="border-bottom:1px solid rgba(255,255,255,0.04);">'
            + '<td style="padding:8px;color:#6a7a9e;">' + d + '</td>'
            + '<td style="padding:8px;color:#dde4f5;">' + e.email + '</td>'
            + '<td style="padding:8px;"><span style="color:' + color + ';font-weight:600;">' + label + '</span></td>'
            + '</tr>';
        }).join('')
      + '</tbody></table>';
  } catch(e) { el.innerHTML = '<div class="empty-state">Error loading events.</div>'; }
}

function showToast(msg, type) {
  const t=document.getElementById('toast');
  t.innerHTML=msg;
  t.classList.toggle('error', type==='error');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), type==='error' ? 6000 : 2800);
}
window.showToast=showToast;
</script>
